name: Odoo complete manufacturing acceptance
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    # Fast gate: fail on style or pure-Python regressions before building the Docker stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host tool dependencies
        run: python -m pip install -r scripts/requirements.txt ruff==0.16.8
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .
      - name: Standalone tests
        run: python -m unittest discover -s tests -v

  foundation:
    needs: lint-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host tool dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Foundation and calculation tests
        run: python scripts/manage.py test
      - name: Configure and validate
        run: |
          python scripts/manage.py setup
          python - <<'PYTHON'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from lib.environment import read_environment, write_environment
          values = read_environment(Path('.env'))
          # Ephemeral CI storage: this tests TLS/functions, not production disk encryption.
          values['DEEP_ENCRYPTED_DATA_DIR'] = str(Path('private-data-ci').resolve())
          write_environment(Path('.env'), values)
          PYTHON
          python scripts/manage.py check
      - name: Start official Odoo and authenticate
        run: python scripts/manage.py start
      - name: Native manufacturing workflow acceptance
        run: python scripts/manage.py acceptance
      - name: Back up database and filestore
        run: python scripts/manage.py backup --output backups/ci.deepenc
      - name: Restore to a new database and authenticate again
        run: |
          python scripts/manage.py restore backups/ci.deepenc --target deep_restore_ci --activate
          python scripts/manage.py verify
      - name: Inspect service state
        if: always()
        run: docker compose ps -a
      - name: Inspect initialization and server logs
        if: failure()
        run: docker compose logs --tail=150 db odoo-init odoo
      - name: Stop services
        if: always()
        run: docker compose down
