[options]
# Passwords and database selection are added at runtime in a private temp file.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = False
list_db = False
db_sslmode = prefer
db_maxconn = 32
workers = 0
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
log_level = info
